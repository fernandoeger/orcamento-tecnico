<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <title>Orçamento Técnico</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- Ícones -->
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Orçamento Técnico">

  <!-- Android -->
  <meta name="theme-color" content="#0b76ef">

  <!-- CONFIG DA EMPRESA -->
  <script src="config.js"></script>

  <style>
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      max-width:980px;
      margin:18px auto;
      padding:12px;
      background:#f7f7f7;
    }

    h1{margin-bottom:6px}
    label{display:block;margin-top:10px;font-weight:600}

    input, textarea{
      width:100%;
      padding:8px;
      margin-top:6px;
      border:1px solid #ccc;
      border-radius:6px;
      box-sizing:border-box;
    }

    .section{
      margin-top:14px;
      padding:12px;
      border:1px solid #eee;
      border-radius:8px;
      background:#fff;
    }

    .btn{
      display:inline-block;
      padding:8px 12px;
      margin-top:10px;
      border-radius:6px;
      border:0;
      background:#0b76ef;
      color:#fff;
      cursor:pointer;
    }

    .btn.secondary{background:#6c757d}
    .btn.history{background:#28a745}

    table{width:100%;border-collapse:collapse;margin-top:8px}
    th,td{padding:8px;border-bottom:1px solid #eee}
    .right{text-align:right}

    .cabecalho-orcamento{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:10px;
    }

    .logo-empresa{
      width:80px;
      max-height:80px;
      object-fit:contain;
    }

    .dados-empresa{
      font-size:14px;
      line-height:1.4;
    }

    @media print{
      body>*:not(.resumo-final){display:none!important}
      .resumo-final{display:block!important}
      .btn{display:none!important}
    }
  </style>
</head>

<body>

<!-- MENU -->
<a href="index.html" class="btn secondary">🏠 Menu</a>
<a href="impressora.html" class="btn secondary">🖨️ Impressora</a>
<a href="caixa.html" class="btn secondary">📘 Caixa</a>

<h1>Orçamento Técnico</h1>

<label>Cliente</label>
<input id="cliente">

<label>Descrição do aparelho</label>
<input id="descricaoAparelho">

<div class="section">
  <h3>Resumo Final</h3>

  <!-- CABEÇALHO EMPRESA (PDF) -->
  <div class="cabecalho-orcamento">
    <img id="empresaLogo" class="logo-empresa">
    <div id="empresaDados" class="dados-empresa"></div>
  </div>
  <hr>

  <table>
    <tr>
      <td>Total</td>
      <td class="right" id="custo">R$ 0,00</td>
    </tr>
  </table>

  <button class="btn" onclick="recalcular()">Calcular</button>
  <button class="btn secondary" onclick="salvarOrcamento()">Salvar</button>
  <button class="btn history" onclick="mostrarHistorico()">Histórico</button>
  <button class="btn secondary" onclick="window.print()">PDF</button>
</div>

<!-- HISTÓRICO -->
<div id="modalHistorico" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6)">
  <div style="background:#fff;margin:40px auto;padding:20px;max-width:700px;border-radius:10px">
    <h3>Histórico</h3>
    <ul id="listaHistorico"></ul>
    <button class="btn secondary" onclick="fecharHistorico()">Fechar</button>
  </div>
</div>

<!-- SCRIPT PRINCIPAL -->
<script src="app.js" defer></script>

</body>
</html>
