  <!-- Carrega o Firebase e substitui as funções de salvar/histórico -->
  <script type="module">
    import { salvarOrcamentoFirestore, carregarOrcamentosOnce, excluirOrcamentoFirestore } from './orcamento.js';

    // Substitui a função de salvar
    window.salvarOrcamento = async function() {
      const itens = getItensCobrados();
      const totalTexto = document.getElementById('custo').innerText;
      const total = parseFloat(totalTexto.replace(/\D/g, '')) / 100;

      const orcamento = {
        data: new Date().toLocaleString('pt-BR'),
        cliente: document.getElementById('cliente').value.trim(),
        aparelho: document.getElementById('descricaoAparelho').value.trim(),
        itens: itens,
        total: total,
        observacoes: document.getElementById('observacoes').value.trim()
      };

      try {
        await salvarOrcamentoFirestore(orcamento);
        alert('Orçamento salvo no Firebase com sucesso!');
      } catch (err) {
        console.error('Erro ao salvar:', err);
        alert('Erro ao salvar: ' + (err.message || 'verifique o console'));
      }
    };

    // Substitui o histórico
    window.mostrarHistorico = async function() {
      try {
        const orcamentos = await carregarOrcamentosOnce();
        const lista = document.getElementById('listaHistorico');
        lista.innerHTML = '';

        if (orcamentos.length === 0) {
          lista.innerHTML = '<li>Nenhum orçamento salvo ainda.</li>';
        } else {
          orcamentos.forEach(orc => {
            const li = document.createElement('li');
            li.style.display = 'flex';
            li.style.justifyContent = 'space-between';
            li.style.alignItems = 'flex-start';

            const info = document.createElement('div');
            info.style.flex = '1';
            info.innerHTML = `
              <strong>${orc.cliente || 'Cliente não informado'}</strong> - ${orc.aparelho || 'Sem descrição'}<br>
              <small>${orc.data || new Date(orc.createdAt).toLocaleString('pt-BR')}</small>
            `;
            info.style.cursor = 'pointer';
            info.onclick = () => carregarDoFirestore(orc);

            const btnExcluir = document.createElement('button');
            btnExcluir.className = 'btn danger';
            btnExcluir.style.padding = '4px 8px';
            btnExcluir.style.fontSize = '0.8rem';
            btnExcluir.style.marginLeft = '10px';
            btnExcluir.textContent = '🗑️';
            btnExcluir.title = 'Excluir este orçamento';
            btnExcluir.onclick = (e) => {
              e.stopPropagation();
              if (confirm(`Excluir orçamento de "${orc.cliente || 'Cliente não informado'}"?`)) {
                excluirOrcamentoFirestore(orc.id).then(() => {
                  mostrarHistorico();
                  alert('Orçamento excluído!');
                }).catch(err => {
                  console.error(err);
                  alert('Erro ao excluir');
                });
              }
            };

            li.appendChild(info);
            li.appendChild(btnExcluir);
            lista.appendChild(li);
          });
        }
        document.getElementById('modalHistorico').style.display = 'block';
      } catch (err) {
        console.error('Erro ao carregar histórico:', err);
        alert('Erro ao carregar histórico do Firebase');
      }
    };

    // Função para carregar orçamento do Firestore no formulário
    window.carregarDoFirestore = function(orc) {
      document.getElementById('cliente').value = orc.cliente || '';
      document.getElementById('descricaoAparelho').value = orc.aparelho || '';
      document.getElementById('observacoes').value = orc.observacoes || '';

      // Reinicia o formulário
      document.getElementById('incluirMaoObra').checked = false;
      document.getElementById('valorMaoObra').value = 120;
      document.getElementById('valorMaoObra').disabled = true;
      document.getElementById('outrosDesc').value = '';

      // Limpa todos os checkboxes e inputs
      document.querySelectorAll('#servicosContainer input[type="checkbox"]').forEach(cb => {
        cb.checked = false;
        cb.closest('.servico-item').querySelector('input[type="number"]').disabled = true;
        cb.closest('.servico-item').querySelector('input[type="number"]').value = 
          PRECOS_SUGERIDOS[cb.getAttribute('data-item')] || 0;
      });

      document.querySelectorAll('input.peca').forEach(input => {
        input.value = 0;
      });

      // Preenche com base nos itens salvos
      if (orc.itens && Array.isArray(orc.itens)) {
        orc.itens.forEach(item => {
          // Tenta encontrar como serviço
          const servicoCheckbox = document.querySelector(`#servicosContainer input[data-item="${item.nome}"][type="checkbox"]`);
          if (servicoCheckbox) {
            servicoCheckbox.checked = true;
            const input = servicoCheckbox.closest('.servico-item').querySelector('input[type="number"]');
            input.disabled = false;
            input.value = item.valor;
          } else {
            // É uma peça
            let nomePeca = item.nome;
            if (item.nome.includes('Outros (')) {
              const match = item.nome.match(/Outros \((.+)\)/);
              if (match) {
                document.getElementById('outrosDesc').value = match[1];
                nomePeca = 'Outros';
              }
            }
            const pecaInput = document.querySelector(`input.peca[data-item="${nomePeca}"]`);
            if (pecaInput) {
              // Remove o lucro (1.25) para exibir o valor original
              pecaInput.value = (item.valor / 1.25).toFixed(2);
            }
          }
        });
      }

      fecharHistorico();
      recalcular();
    };
  </script>
</body>
