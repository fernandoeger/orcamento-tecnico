<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Orçamento Técnico</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      max-width:980px;
      margin:18px auto;
      padding:12px
    }
    h1{margin-bottom:6px}
    label{display:block;margin-top:10px;font-weight:600}
    input[type="text"],
    input[type="number"],
    select,
    textarea{
      width:100%;
      padding:8px;
      margin-top:6px;
      border:1px solid #ccc;
      border-radius:6px;
      box-sizing:border-box
    }
    .section{
      margin-top:14px;
      padding:12px;
      border:1px solid #eee;
      border-radius:8px;
      background:#fafafa
    }
    table{width:100%;border-collapse:collapse;margin-top:8px}
    th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}
    .right{text-align:right}
    .btn{
      display:inline-block;
      padding:8px 12px;
      margin-top:10px;
      border-radius:6px;
      border:0;
      background:#0b76ef;
      color:white;
      cursor:pointer
    }
    .btn.secondary{background:#6c757d}
    ul{padding-left:18px}
  </style>
</head>

<body>

<h1>Orçamento Técnico</h1>

<label>Cliente</label>
<input id="cliente" type="text" placeholder="Nome do cliente (opcional)" />

<label>Descrição do aparelho</label>
<input id="descricaoAparelho" type="text" placeholder="Ex: Notebook Acer / Desktop HP" />

<div class="section">
  <h3>Serviços</h3>
  <div id="servicosContainer"></div>
</div>

<div class="section">
  <h3>Peças</h3>
  <table>
    <tr><td>SSD</td><td><input class="peca" type="number" step="0.01"></td></tr>
    <tr><td>HD</td><td><input class="peca" type="number" step="0.01"></td></tr>
    <tr><td>RAM</td><td><input class="peca" type="number" step="0.01"></td></tr>
    <tr><td>Bateria</td><td><input class="peca" type="number" step="0.01"></td></tr>
    <tr><td>Outros</td><td><input class="peca" type="number" step="0.01"></td></tr>
  </table>
</div>

<div class="section">
  <h3>Total</h3>
  <p id="custo"><strong>R$ 0,00</strong></p>
  <button class="btn" onclick="recalcular()">Calcular</button>
  <button class="btn secondary" onclick="salvarOrcamento()">Salvar Orçamento</button>
</div>

<!-- ================= LIVRO CAIXA ================= -->

<div class="section">
  <h3>📘 Livro Caixa</h3>

  <label>Tipo</label>
  <select id="caixaTipo">
    <option value="entrada">Entrada</option>
    <option value="saida">Saída</option>
  </select>

  <label>Descrição</label>
  <input id="caixaDescricao" type="text" placeholder="Ex: Orçamento pago / Compra de peça" />

  <label>Valor (R$)</label>
  <input id="caixaValor" type="number" step="0.01" />

  <button class="btn" onclick="salvarMovimentoCaixa()">Salvar movimento</button>
</div>

<div class="section">
  <h3>📊 Resumo do Caixa</h3>
  <p>Entradas: R$ <span id="totalEntradas">0,00</span></p>
  <p>Saídas: R$ <span id="totalSaidas">0,00</span></p>
  <p><strong>Saldo: R$ <span id="saldoCaixa">0,00</span></strong></p>
</div>

<div class="section">
  <h3>📜 Histórico do Caixa</h3>
  <ul id="listaCaixa"></ul>
</div>

<script src="./orcamento.js"></script>

</body>
</html>
