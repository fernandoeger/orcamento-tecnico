<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Orçamento</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Orçamento Técnico">

  <link rel="apple-touch-icon" sizes="180x180" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icon-120.png">
  <link rel="apple-touch-icon" sizes="76x76" href="icon-76.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Orçamento</h1>

  <label>Cliente</label>
  <input id="cliente" type="text" placeholder="Nome do cliente (opcional)" />

  <label>Descrição do aparelho</label>
  <input id="descricaoAparelho" type="text" placeholder="Ex: Notebook Acer E5-511 / Desktop HP" />

  <div class="section">
    <h3>Mão de Obra</h3>
    <div class="checkbox-container">
      <input type="checkbox" id="incluirMaoObra" />
      <label for="incluirMaoObra">Incluir Mão de Obra no orçamento</label>
    </div>
    <input id="valorMaoObra" type="number" min="0" step="0.01" value="120" disabled />
  </div>

  <div class="section">
    <h3>Serviços</h3>
    <div id="servicosContainer"></div>
  </div>

  <div class="section">
    <h3>Peças</h3>
    <table id="pecasTable">
      <tbody>
        <tr><td>SSD</td><td><input class="valor peca" data-item="SSD" type="number"></td></tr>
        <tr><td>HD</td><td><input class="valor peca" data-item="HD" type="number"></td></tr>
        <tr><td>RAM</td><td><input class="valor peca" data-item="RAM" type="number"></td></tr>
        <tr><td>Outros</td><td><input class="valor peca" data-item="Outros" type="number"></td></tr>
      </tbody>
    </table>
    <input id="outrosDesc" type="text" placeholder="Descrição do item Outros">
  </div>

  <div class="section resumo-final">
    <div class="cabecalho-print" id="cabecalhoPrint"></div>

    <table id="cobrancaTable">
      <tbody></tbody>
    </table>

    <p>Total: <strong id="custo">R$ 0,00</strong></p>

    <button onclick="recalcular()">Calcular</button>
    <button onclick="salvarOrcamento()">Salvar</button>
    <button onclick="mostrarHistorico()">Histórico</button>
    <button onclick="window.print()">PDF</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
