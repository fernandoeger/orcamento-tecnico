<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Orçamento</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 20px;
  color: #222;
}
h1 {
  text-align: center;
  color: #0b76ef;
}
.section {
  margin-bottom: 20px;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}
th, td {
  border: 1px solid #999;
  padding: 8px;
  text-align: left;
}
input, select {
  width: 100%;
  padding: 6px;
  box-sizing: border-box;
}
.btn {
  display: inline-block;
  background: #0b76ef;
  color: white;
  padding: 10px 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}
.btn:hover {
  background: #095bb3;
}
.resumo-final {
  margin-top: 20px;
  border-top: 2px solid #0b76ef;
  padding-top: 10px;
}
@media print {
  body { margin: 0; padding: 0; max-width: none; font-size: 10pt; }
  .btn, footer, .ocultar-print { display: none !important; }
  /* 🔒 Oculta a porcentagem de lucro no PDF */
  #porcent, label[for="porcent"] { display: none !important; }
}
</style>
</head>
<body>

<h1>Orçamento Técnico</h1>

<div class="section">
  <label for="cliente">Cliente:</label>
  <input type="text" id="cliente" placeholder="Nome do cliente">
</div>

<div class="section">
  <label for="porcent">Porcentagem de Lucro (%):</label>
  <input type="number" id="porcent" value="25">
</div>

<div class="section">
  <table id="itens">
    <thead>
      <tr>
        <th>Descrição</th>
        <th>Valor (R$)</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><input type="text" placeholder="Ex: SSD 240GB"></td>
        <td><input type="number" class="valor" value="0"></td>
      </tr>
      <tr>
        <td><input type="text" placeholder="Ex: Memória RAM 8GB"></td>
        <td><input type="number" class="valor" value="0"></td>
      </tr>
    </tbody>
  </table>
</div>

<div class="section">
  <button class="btn" onclick="adicionarItem()">Adicionar Item</button>
  <button class="btn" onclick="calcularOrcamento()">Calcular Total</button>
  <button class="btn" onclick="gerarPDF()">Gerar PDF</button>
</div>

<div class="resumo-final">
  <table>
    <tr><th>Subtotal</th><td>R$ <span id="subtotal">0.00</span></td></tr>
    <tr><th>Lucro</th><td>R$ <span id="lucro">0.00</span></td></tr>
    <tr><th>Mão de obra e serviços técnicos</th><td>R$ <span id="maoDeObra">120.00</span></td></tr>
    <tr><th>Total</th><td>R$ <span id="total">0.00</span></td></tr>
  </table>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
function adicionarItem() {
  const tabela = document.querySelector("#itens tbody");
  const linha = document.createElement("tr");
  linha.innerHTML = `
    <td><input type="text" placeholder="Descrição do item"></td>
    <td><input type="number" class="valor" value="0"></td>
  `;
  tabela.appendChild(linha);
}

function calcularOrcamento() {
  const porcent = parseFloat(document.getElementById("porcent").value) || 0;
  const maoDeObra = 120; // 💰 Valor fixo
  let subtotal = 0;

  document.querySelectorAll(".valor").forEach(input => {
    subtotal += parseFloat(input.value) || 0;
  });

  const lucro = subtotal * (porcent / 100);
  const total = subtotal + lucro + maoDeObra;

  document.getElementById("subtotal").textContent = subtotal.toFixed(2);
  document.getElementById("lucro").textContent = lucro.toFixed(2);
  document.getElementById("maoDeObra").textContent = maoDeObra.toFixed(2);
  document.getElementById("total").textContent = total.toFixed(2);
}

function gerarPDF() {
  calcularOrcamento();
  const cliente = document.getElementById("cliente").value || "Sem nome";
  const elemento = document.body.cloneNode(true);

  // Remove botões e campos desnecessários
  elemento.querySelectorAll(".btn").forEach(b => b.remove());

  const opt = {
    margin: 10,
    filename: `Orcamento_${cliente}.pdf`,
    html2canvas: { scale: 2 },
    jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
  };
  html2pdf().set(opt).from(elemento).save();
}
</script>

</body>
</html>
