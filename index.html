<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamentos</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 0;
  }
  #app {
    display: none;
    padding: 20px;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
  }
  input, textarea, button, select {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 8px;
    border-radius: 5px;
    border: 1px solid #ccc;
  }
  button {
    background: #2196F3;
    color: white;
    border: none;
    cursor: pointer;
  }
  button:hover {
    background: #1976D2;
  }
  #login-container {
    padding: 20px;
    max-width: 400px;
    margin: 50px auto;
    background: white;
    border-radius: 10px;
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-container">
  <h2>Login / Cadastro</h2>
  <input type="email" id="email" placeholder="E-mail">
  <input type="password" id="senha" placeholder="Senha">
  <button id="loginBtn">Entrar</button>
  <button id="signupBtn">Cadastrar</button>
  <p id="msg"></p>
</div>

<!-- APP -->
<div id="app">
  <div class="container">
    <h2>Gerar Orçamento</h2>
    <input id="cliente" placeholder="Nome do cliente">
    <input id="descricaoAparelho" placeholder="Aparelho / Peça">
    
    <label><input type="checkbox" id="incluirMaoObra"> Incluir mão de obra</label>
    <input type="number" id="valorMaoObra" placeholder="Valor mão de obra">

    <h3>Serviços</h3>
    <div id="servicosContainer">
      <div class="servico-item">
        <label><input type="checkbox"> Formatação</label>
        <input type="number" class="servicoValor" data-item="Formatação" placeholder="Valor (R$)">
      </div>
      <div class="servico-item">
        <label><input type="checkbox"> Troca de HD</label>
        <input type="number" class="servicoValor" data-item="Troca de HD" placeholder="Valor (R$)">
      </div>
    </div>

    <h3>Peças</h3>
    <input type="number" class="peca" data-item="Peça 1" placeholder="Peça 1 (R$)">
    <input type="number" class="peca" data-item="Peça 2" placeholder="Peça 2 (R$)">

    <textarea id="outrosDesc" placeholder="Outros serviços"></textarea>
    <textarea id="observacoes" placeholder="Observações"></textarea>

    <button id="salvarOrcamento">Salvar Orçamento</button>
    <button id="logout">Sair</button>

    <h3>Histórico</h3>
    <ul id="historico"></ul>
  </div>
</div>

<script type="module">
  // Importações Firebase
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // 🔧 Configuração do Firebase
  const firebaseConfig = {
    apiKey: "SUA_API_KEY_AQUI",
    authDomain: "SEU_AUTH_DOMAIN",
    projectId: "SEU_PROJECT_ID",
    storageBucket: "SEU_BUCKET",
    messagingSenderId: "SEU_SENDER_ID",
    appId: "SEU_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginContainer = document.getElementById('login-container');
  const appContainer = document.getElementById('app');
  const msg = document.getElementById('msg');

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value.trim();
    try {
      await signInWithEmailAndPassword(auth, email, senha);
    } catch (error) {
      msg.textContent = "Erro: " + error.message;
    }
  });

  document.getElementById('signupBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value.trim();
    try {
      await createUserWithEmailAndPassword(auth, email, senha);
      msg.textContent = "Conta criada com sucesso!";
    } catch (error) {
      msg.textContent = "Erro: " + error.message;
    }
  });

  document.getElementById('logout').addEventListener('click', async () => {
    await signOut(auth);
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginContainer.style.display = "none";
      appContainer.style.display = "block";
      carregarHistorico(user.uid);
    } else {
      loginContainer.style.display = "block";
      appContainer.style.display = "none";
    }
  });

  // Salvar orçamento
  document.getElementById('salvarOrcamento').addEventListener('click', async () => {
    const user = auth.currentUser;
    if (!user) return alert("Faça login primeiro!");

    const orcamento = {
      id: Date.now(),
      data: new Date().toLocaleString('pt-BR'),
      cliente: document.getElementById('cliente').value.trim(),
      aparelho: document.getElementById('descricaoAparelho').value.trim(),
      maoObraIncluida: document.getElementById('incluirMaoObra').checked,
      valorMaoObra: parseFloat(document.getElementById('valorMaoObra').value) || 0,
      servicos: Array.from(document.querySelectorAll('#servicosContainer .servico-item')).map(div => {
        const checkbox = div.querySelector('input[type="checkbox"]');
        const input = div.querySelector('input[type="number"]');
        return {
          nome: input.getAttribute('data-item'),
          selecionado: checkbox.checked,
          valor: parseFloat(input.value) || 0
        };
      }),
      pecas: Array.from(document.querySelectorAll('input.peca')).map(input => ({
        nome: input.getAttribute('data-item'),
        valor: parseFloat(input.value) || 0
      })),
      outrosDesc: document.getElementById('outrosDesc').value.trim(),
      observacoes: document.getElementById('observacoes').value.trim()
    };

    try {
      await addDoc(collection(db, "orcamentos"), { ...orcamento, uid: user.uid });
      alert("Orçamento salvo!");
      carregarHistorico(user.uid);
    } catch (e) {
      console.error("Erro ao salvar: ", e);
    }
  });

  async function carregarHistorico(uid) {
    const historicoLista = document.getElementById('historico');
    historicoLista.innerHTML = "";
    const q = query(collection(db, "orcamentos"), where("uid", "==", uid));
    const snapshot = await getDocs(q);
    snapshot.forEach((doc) => {
      const data = doc.data();
      const li = document.createElement("li");
      li.textContent = `${data.data} — ${data.cliente} — ${data.aparelho}`;
      historicoLista.appendChild(li);
    });
  }

  // Cache offline
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch(console.error);
  }
</script>
</body>
</html>
