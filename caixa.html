<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Livro Caixa</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      max-width:900px;
      margin:18px auto;
      padding:12px;
      background:#f7f7f7
    }
    h1{margin-bottom:10px}
    label{display:block;margin-top:10px;font-weight:600}
    input, select{
      width:100%;
      padding:8px;
      margin-top:6px;
      border:1px solid #ccc;
      border-radius:6px
    }
    .section{
      background:#fff;
      padding:12px;
      margin-top:14px;
      border-radius:8px;
      border:1px solid #eee
    }
    .btn{
      display:inline-block;
      padding:8px 12px;
      margin-top:10px;
      border-radius:6px;
      border:0;
      background:#0b76ef;
      color:#fff;
      cursor:pointer;
      text-decoration:none
    }
    .btn.secondary{background:#6c757d}
    ul{padding-left:18px}
    li{margin-bottom:8px}
  </style>
</head>

<body>

<a href="index.html" class="btn secondary">⬅️ Voltar para Orçamentos</a>

<h1>📘 Livro Caixa</h1>

<div class="section">
  <label>Tipo</label>
  <select id="tipo">
    <option value="entrada">Entrada</option>
    <option value="saida">Saída</option>
  </select>

  <label>Descrição</label>
  <input id="descricao" type="text" placeholder="Ex: Orçamento pago / Compra de peça">

  <label>Valor (R$)</label>
  <input id="valor" type="number" step="0.01">

  <button class="btn" onclick="salvarMovimento()">Salvar</button>
</div>

<div class="section">
  <h3>📊 Resumo</h3>
  <p>Entradas: R$ <span id="entradas">0,00</span></p>
  <p>Saídas: R$ <span id="saidas">0,00</span></p>
  <p><strong>Saldo: R$ <span id="saldo">0,00</span></strong></p>
</div>

<div class="section">
  <h3>📜 Histórico</h3>
  <ul id="lista"></ul>
</div>

<script src="./caixa.js"></script>

</script>
</body>
</html>
