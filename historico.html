<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Histórico de Orçamentos</title>
  <style>
    body { font-family: system-ui; max-width: 900px; margin: 20px auto; padding: 16px; }
    h1 { margin-bottom: 16px; }
    .orcamento { border: 1px solid #ddd; padding: 16px; margin-bottom: 16px; border-radius: 8px; }
    .orcamento-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .orcamento-itens { margin: 12px 0; }
    .orcamento-itens table { width: 100%; border-collapse: collapse; }
    .orcamento-itens th, .orcamento-itens td { padding: 6px; text-align: left; border-bottom: 1px solid #eee; }
    .right { text-align: right; }
    .btn { padding: 8px 12px; background: #0b76ef; color: white; border: none; border-radius: 6px; cursor: pointer; margin-right: 8px; }
    .btn:hover { opacity: 0.9; }
    .btn.delete { background: #e74c3c; }
    .vazio { text-align: center; color: #666; margin-top: 30px; }
  </style>
</head>
<body>
  <h1>Histórico de Orçamentos</h1>
  <div id="listaOrcamentos"></div>
  <button class="btn" onclick="window.location.href='index.html'">Voltar</button>

<script>
function formatBR(value) {
  return parseFloat(value).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function carregarHistorico() {
  const lista = document.getElementById('listaOrcamentos');
  const historico = JSON.parse(localStorage.getItem('orcamentos') || '[]');

  if (historico.length === 0) {
    lista.innerHTML = '<p class="vazio">Nenhum orçamento salvo ainda.</p>';
    return;
  }

  lista.innerHTML = '';
  historico.forEach(orc => {
    const div = document.createElement('div');
    div.className = 'orcamento';
    let itensHtml = '<table><thead><tr><th>Item</th><th class="right">Valor</th></tr></thead><tbody>';
    orc.itens.forEach(item => {
      itensHtml += `<tr><td>${item.nome}</td><td class="right">R$ ${formatBR(item.valor)}</td></tr>`;
    });
    itensHtml += '</tbody></table>';

    div.innerHTML = `
      <div class="orcamento-header">
        <strong>${orc.cliente} - ${orc.aparelho}</strong>
        <small>${orc.data}</small>
      </div>
      <div class="orcamento-itens">${itensHtml}</div>
      <div><strong>Total: R$ ${formatBR(orc.total)}</strong></div>
      ${orc.observacoes ? `<div style="margin-top:8px;"><strong>Observações:</strong> ${orc.observacoes}</div>` : ''}
      <div style="margin-top:12px;">
        <button class="btn" onclick="imprimirOrcamento(${orc.id})">Imprimir</button>
        <button class="btn delete" onclick="excluirOrcamento(${orc.id})">Excluir</button>
      </div>
    `;
    lista.appendChild(div);
  });
}

function excluirOrcamento(id) {
  if (!confirm('Tem certeza que deseja excluir este orçamento?')) return;
  let historico = JSON.parse(localStorage.getItem('orcamentos') || '[]');
  historico = historico.filter(o => o.id !== id);
  localStorage.setItem('orcamentos', JSON.stringify(historico));
  carregarHistorico();
}

function imprimirOrcamento(id) {
  const historico = JSON.parse(localStorage.getItem('orcamentos') || '[]');
  const orc = historico.find(o => o.id === id);
  if (!orc) return;

  const conteudo = `
    <h2>Orçamento Técnico</h2>
    <p><strong>Cliente:</strong> ${orc.cliente}</p>
    <p><strong>Aparelho:</strong> ${orc.aparelho}</p>
    <table border="1" style="width:100%;border-collapse:collapse;margin:10px 0;">
      <thead><tr><th>Item</th><th style="text-align:right;">Valor (R$)</th></tr></thead>
      <tbody>
        ${orc.itens.map(i => `<tr><td>${i.nome}</td><td style="text-align:right;">${formatBR(i.valor)}</td></tr>`).join('')}
      </tbody>
    </table>
    <p><strong>Total: R$ ${formatBR(orc.total)}</strong></p>
    ${orc.observacoes ? `<p><strong>Observações:</strong> ${orc.observacoes}</p>` : ''}
  `;

  const janela = window.open('', '_blank');
  janela.document.write(`
    <html><head><title>Orçamento</title>
    <style>body{font-family:Arial,sans-serif;padding:20px;}</style>
    </head><body>${conteudo}<script>window.print();setTimeout(() => window.close(), 1000);</sc` + `ript></body></html>
  `);
}

document.addEventListener('DOMContentLoaded', carregarHistorico);
</script>
</body>
</html>
