<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Orçamento Técnico</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;max-width:480px;margin:40px auto;padding:20px}
    input{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:1px solid #ccc;box-sizing:border-box}
    button{padding:10px 14px;border:0;background:#0b76ef;color:white;border-radius:6px;cursor:pointer}
    .row{display:flex;gap:8px}
    .row button{flex:1}
    .small{font-size:0.9rem;color:#666;margin-top:8px}
    #camposEmpresa { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
  </style>
</head>
<body>
  <h1>Entrar / Criar conta</h1>

  <label>Email</label>
  <input id="email" type="email" placeholder="seu@email.com" />

  <label>Senha</label>
  <input id="senha" type="password" placeholder="Senha (min 6 caracteres)" />

  <!-- Campos de empresa (só aparecem ao criar conta) -->
  <div id="camposEmpresa">
    <label>Nome da Empresa / Técnico <small>(obrigatório)</small></label>
    <input id="empresa" type="text" placeholder="Ex: Tech Solutions" />

    <label>CNPJ <small>(opcional)</small></label>
    <input id="cnpj" type="text" placeholder="00.000.000/0000-00" />

    <label>Telefone / WhatsApp <small>(obrigatório)</small></label>
    <input id="telefone" type="tel" placeholder="(00) 00000-0000" />
  </div>

  <div class="row">
    <button id="btnLogin">Entrar</button>
    <button id="btnCriar">Criar conta</button>
  </div>

  <p class="small">Ao entrar, você será redirecionado ao app e seu histórico será sincronizado.</p>

  <script type="module">
    import { auth, db } from './firebase.js';
    import { 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-auth.js";
    import { 
      doc, 
      setDoc 
    } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js";

    const emailEl = document.getElementById('email');
    const senhaEl = document.getElementById('senha');
    const btnLogin = document.getElementById('btnLogin');
    const btnCriar = document.getElementById('btnCriar');
    const camposEmpresa = document.getElementById('camposEmpresa');

    // Mostrar/ocultar campos de empresa
    btnCriar.addEventListener('click', () => {
      camposEmpresa.style.display = 'block';
    });
    btnLogin.addEventListener('click', () => {
      camposEmpresa.style.display = 'none';
    });

    // Criar conta
    btnCriar.addEventListener('click', async () => {
      const email = emailEl.value.trim();
      const senha = senhaEl.value;
      const empresa = document.getElementById('empresa')?.value.trim();
      const cnpj = document.getElementById('cnpj')?.value.trim() || null;
      const telefone = document.getElementById('telefone')?.value.trim();

      if (!email || senha.length < 6) return alert('Informe e-mail e senha (mín 6 chars).');
      if (!empresa) return alert('Informe o nome da empresa ou técnico.');
      if (!telefone) return alert('Informe um telefone de contato.');

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
        
        // Salvar perfil no Firestore
        const perfil = {
          uid: userCredential.user.uid,
          email: email,
          empresa: empresa,
          cnpj: cnpj || null,
          telefone: telefone,
          servicos: {
            "Limpeza interna e troca de pasta térmica": 100,
            "Formatação": 60,
            "formatação + Backup": 100,
            "Reballing": 250,
            "Atualização de BIOS": 40,
            "Diagnóstico": 30,
            "Troca de teclado (mão de obra)": 90,
            "Instalação de drivers": 30
          },
          createdAt: Date.now()
        };

        await setDoc(doc(db, 'usuarios', userCredential.user.uid), perfil);
        location.href = 'index.html';
      } catch (err) {
        alert('Erro ao criar conta: ' + err.message);
      }
    });

    // Login
    btnLogin.addEventListener('click', async () => {
      const email = emailEl.value.trim();
      const senha = senhaEl.value;
      if (!email || senha.length < 6) return alert('Informe e-mail e senha (mín 6 chars).');
      try {
        await signInWithEmailAndPassword(auth, email, senha);
        location.href = 'index.html';
      } catch (err) {
        alert('Erro ao entrar: ' + err.message);
      }
    });

    // Redireciona se já estiver logado
    onAuthStateChanged(auth, user => {
      if (user) location.href = 'index.html';
    });
  </script>
</body>
</html>
