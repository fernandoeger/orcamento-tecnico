<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Orçamento de Impressora</title>

<style>
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  max-width:900px;
  margin:0 auto;
  padding:14px;
  background:#f7f7f7;
}
h1{margin-bottom:10px}
label{display:block;margin-top:10px;font-weight:600}
input{
  width:100%;
  padding:10px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}
.section{
  background:#fff;
  padding:14px;
  margin-top:14px;
  border-radius:10px;
  border:1px solid #eee;
}
.btn{
  display:inline-block;
  padding:10px 14px;
  margin-top:10px;
  border-radius:8px;
  border:0;
  background:#0b76ef;
  color:#fff;
  cursor:pointer;
  font-size:15px;
}
.btn.secondary{background:#6c757d}
.btn.history{background:#28a745}
.linha-servico{
  display:grid;
  grid-template-columns: 28px 1fr;
  gap:10px;
  margin-bottom:14px;
}
.linha-servico input[type="checkbox"]{
  transform:scale(1.3);
  margin-top:4px;
}
.linha-servico .nome{font-weight:600}
.linha-servico .valor{margin-top:6px;max-width:160px}
ul{list-style:none;padding:0}
li{padding:12px 0;border-bottom:1px solid #eee}
@media print{
  body>*:not(.resumo-final){display:none!important}
  .resumo-final{display:block!important;background:#fff;padding:20px}
  .btn{display:none!important}
}
</style>
</head>

<body>

<a href="index.html" class="btn secondary">⬅️ Informática</a>
<a href="caixa.html" class="btn secondary">📘 Livro Caixa</a>

<h1>🖨️ Orçamento de Impressora</h1>

<label>Cliente</label>
<input id="cliente">

<label>Modelo da impressora</label>
<input id="modelo">

<div class="section">
  <h3>Serviços</h3>
  <div id="servicos"></div>
</div>

<div class="section">
  <strong>Total:</strong> <span id="total">R$ 0,00</span><br>
  <button class="btn" onclick="calcular()">Calcular</button>
  <button class="btn secondary" onclick="salvarOrcamento()">Salvar</button>
  <button class="btn history" onclick="mostrarHistorico()">Histórico</button>
  <button class="btn secondary" onclick="window.print()">PDF</button>
</div>

<div class="section resumo-final" style="display:none">
  <h2>Orçamento de Impressora</h2>
  <p><strong>Cliente:</strong> <span id="pdfCliente"></span></p>
  <p><strong>Impressora:</strong> <span id="pdfModelo"></span></p>
  <p><strong>Data:</strong> <span id="pdfData"></span></p>
  <table style="width:100%;border-collapse:collapse">
    <tbody id="pdfServicos"></tbody>
  </table>
  <h3 style="text-align:right">Total: R$ <span id="pdfTotal"></span></h3>
</div>

<div id="modalHistorico" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6)">
  <div style="background:#fff;margin:40px auto;padding:20px;max-width:700px;border-radius:10px">
    <h3>Histórico de Impressoras</h3>
    <ul id="listaHistorico"></ul>
    <button class="btn secondary" onclick="fecharHistorico()">Fechar</button>
  </div>
</div>

<script>
const SERVICOS_IMPRESSORA={
  "Instalação USB":50,
  "Instalação Wi-Fi":80,
  "Configuração completa":120,
  "Limpeza de cabeçote":80,
  "Desentupimento":120,
  "Reset de contador":60,
  "Manutenção preventiva":100,
  "Diagnóstico / Teste":40
};

function renderizarServicos(){
  servicos.innerHTML='';
  Object.entries(SERVICOS_IMPRESSORA).forEach(([n,v])=>{
    const d=document.createElement('div');
    d.className='linha-servico';
    d.innerHTML=`
      <input type="checkbox">
      <div>
        <div class="nome">${n}</div>
        <input class="valor" type="number" value="${v}" disabled>
      </div>`;
    const cb=d.querySelector('input[type="checkbox"]');
    const inp=d.querySelector('.valor');
    cb.onchange=()=>{inp.disabled=!cb.checked;if(!cb.checked)inp.value=0;calcular()};
    inp.oninput=calcular;
    servicos.appendChild(d);
  });
}

function calcular(){
  let total=0;
  pdfServicos.innerHTML='';
  document.querySelectorAll('.linha-servico').forEach(l=>{
    if(l.querySelector('input[type="checkbox"]').checked){
      const nome=l.querySelector('.nome').textContent;
      const val=Number(l.querySelector('.valor').value||0);
      total+=val;
      pdfServicos.innerHTML+=`<tr><td>${nome}</td><td style="text-align:right">R$ ${val.toLocaleString('pt-BR',{minimumFractionDigits:2})}</td></tr>`;
    }
  });
  totalSpan(total);
}

function totalSpan(t){
  total.innerText='R$ '+t.toLocaleString('pt-BR',{minimumFractionDigits:2});
  pdfTotal.innerText=t.toLocaleString('pt-BR',{minimumFractionDigits:2});
  pdfCliente.innerText=cliente.value||'—';
  pdfModelo.innerText=modelo.value||'—';
  pdfData.innerText=new Date().toLocaleString('pt-BR');
}

function salvarOrcamento(){
  const lista=JSON.parse(localStorage.getItem('orcamentos')||'[]');
  const serv=[];
  document.querySelectorAll('.linha-servico').forEach(l=>{
    if(l.querySelector('input[type="checkbox"]').checked){
      serv.push({
        nome:l.querySelector('.nome').textContent,
        valor:Number(l.querySelector('.valor').value)
      });
    }
  });
  lista.unshift({
    id:Date.now(),
    tipo:'impressora',
    cliente:cliente.value,
    equipamento:modelo.value,
    servicos:serv,
    status:'aberto'
  });
  localStorage.setItem('orcamentos',JSON.stringify(lista));
  alert('Orçamento salvo');
}

function mostrarHistorico(){
  listaHistorico.innerHTML='';
  const h=JSON.parse(localStorage.getItem('orcamentos')||[]).filter(o=>o.tipo==='impressora');
  h.forEach(o=>{
    let t=0;o.servicos.forEach(s=>t+=s.valor);
    const li=document.createElement('li');
    li.innerHTML=`<strong>${o.cliente}</strong><br>${o.equipamento}<br>Total: R$ ${t.toLocaleString('pt-BR',{minimumFractionDigits:2})}<br>Status: ${o.status.toUpperCase()}`;
    const b=document.createElement('button');
    b.className='btn';
    b.textContent=o.status==='pago'?'✔️ Pago':'💰 Confirmar pagamento';
    b.disabled=o.status==='pago';
    b.onclick=()=>confirmarPagamento(o);
    li.appendChild(b);
    listaHistorico.appendChild(li);
  });
  modalHistorico.style.display='block';
}

function confirmarPagamento(o){
  let t=0;o.servicos.forEach(s=>t+=s.valor);
  const c=JSON.parse(localStorage.getItem('livroCaixa')||[]);
  c.unshift({
    id:Date.now(),
    tipo:'entrada',
    descricao:`Pagamento impressora - ${o.equipamento}`,
    valor:t,
    data:new Date().toLocaleString('pt-BR')
  });
  localStorage.setItem('livroCaixa',JSON.stringify(c));
  o.status='pago';
  atualizar(o);
  mostrarHistorico();
}

function atualizar(o){
  const h=JSON.parse(localStorage.getItem('orcamentos')||[]);
  localStorage.setItem('orcamentos',JSON.stringify(h.map(x=>x.id===o.id?o:x)));
}

function fecharHistorico(){
  modalHistorico.style.display='none';
}

document.addEventListener('DOMContentLoaded',renderizarServicos);
</script>
</body>
</html>
